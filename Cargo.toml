# wyj-code — 独立实现的 Rust 终端 AI 编程助手
# Clean-room 净室实现，不包含任何第三方专有提示词或资产。
[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/api",
    "crates/core",
    "crates/tools",
    "crates/tui",
    "crates/commands",
    "crates/mcp",
    "crates/i18n",
    "crates/store",
    "crates/computer",
    "crates/sandbox",
]

[workspace.package]
version = "1.5.9"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["owen"]
rust-version = "1.80"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "net", "sync", "time", "signal"] }
# HTTP + SSE
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# JSON Schema
schemars = { version = "0.8", features = ["derive"] }
jsonschema = { version = "0.18.3", default-features = false }
# 错误处理
anyhow = "1"
thiserror = "2"
# 日志（本地，无遥测）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 配置目录
directories = "5"
# CLI 解析
clap = { version = "4", features = ["derive", "env"] }
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info", "scrolling-regions"] }
crossterm = "0.28"
# 异步 trait
async-trait = "0.1"
# 文件匹配
globset = "0.4"
ignore = "0.4"
# diff / edit 验证
similar = "2"
# SSE 流式解析
eventsource-stream = "0.2"
httpdate = "1"
# 其他工具
futures = "0.3"
bytes = "1"
http = "1"
url = "2"
# 进程组信号（BashSessionManager kill）
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pin-project-lite = "0.2"
# WebFetch HTML 解析
scraper = "0.21"
# 编码检测
encoding_rs = "0.8"
# 正则（Grep 工具）
regex = "1"
# Markdown 解析（TUI 渲染）
pulldown-cmark = { version = "0.12", default-features = false }
# 剪贴板（图片粘贴 + Ctrl+Y 复制）
arboard = "3"
base64 = "0.22"
png = "0.17"
# 字符显示宽度（与 ratatui 保持一致）
unicode-width = "0.2"
# 多语言（i18n）
rust-i18n = "3"
# 测试用临时目录
tempfile = "3"
# 版本号比较（self-update）
semver = "1"
# 校验和（self-update）
sha2 = "0.10"
# cron 表达式解析与下次触发时间计算（定时任务面板）
cron = { version = "0.17", features = ["serde"] }
# 压缩包解压（self-update）
flate2 = "1"
tar = "0.4"
zip = "2"

# 内部 crate
wyj-config = { path = "crates/config" }
wyj-api = { path = "crates/api" }
wyj-core = { path = "crates/core" }
wyj-tools = { path = "crates/tools" }
wyj-tui = { path = "crates/tui" }
wyj-commands = { path = "crates/commands" }
wyj-mcp = { path = "crates/mcp" }
wyj-i18n = { path = "crates/i18n" }
wyj-store = { path = "crates/store" }
wyj-computer = { path = "crates/computer" }
wyj-sandbox = { path = "crates/sandbox" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
