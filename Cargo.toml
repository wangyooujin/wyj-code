# wyj-code — 独立实现的 Rust 终端 AI 编程助手
# Clean-room 净室实现，不包含任何第三方专有提示词或资产。
[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/api",
    "crates/core",
    "crates/tools",
    "crates/tui",
    "crates/commands",
    "crates/mcp",
    "crates/i18n",
    "crates/store",
    "crates/computer",
]

[workspace.package]
version = "0.3.20"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["owen"]
rust-version = "1.80"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "net", "sync", "time", "signal"] }
# HTTP + SSE
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# JSON Schema
schemars = { version = "0.8", features = ["derive"] }
jsonschema = { version = "0.18.3", default-features = false }
# 错误处理
anyhow = "1"
thiserror = "2"
# 日志（本地，无遥测）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 配置目录
directories = "5"
# CLI 解析
clap = { version = "4", features = ["derive", "env"] }
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info", "scrolling-regions"] }
crossterm = "0.28"
# 异步 trait
async-trait = "0.1"
# 文件匹配
globset = "0.4"
ignore = "0.4"
# diff / edit 验证
similar = "2"
# SSE 流式解析
eventsource-stream = "0.2"
httpdate = "1"
# 其他工具
futures = "0.3"
bytes = "1"
http = "1"
url = "2"
# 进程组信号（BashSessionManager kill）
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pin-project-lite = "0.2"
# WebFetch HTML 解析
scraper = "0.21"
# 编码检测
encoding_rs = "0.8"
# 正则（Grep 工具）
regex = "1"
# Grep 纯 Rust 兜底：从正则抽字面量做 memchr/memmem 预筛
regex-automata = "0.4"
regex-syntax = "0.8"
# Markdown 解析（TUI 渲染）
pulldown-cmark = { version = "0.12", default-features = false }
# 剪贴板（图片粘贴 + Ctrl+Y 复制）
arboard = "3"
base64 = "0.22"
png = "0.17"
# 字符显示宽度（与 ratatui 保持一致）
unicode-width = "0.2"
# 多语言（i18n）
rust-i18n = "3"
# 测试用临时目录
tempfile = "3"
# 版本号比较（self-update）
semver = "1"
# 校验和（self-update）
sha2 = "0.10"
# 压缩包解压（self-update）
flate2 = "1"
tar = "0.4"
zip = "2"

# 内部 crate
wyj-config = { path = "crates/config" }
wyj-api = { path = "crates/api" }
wyj-core = { path = "crates/core" }
wyj-tools = { path = "crates/tools" }
wyj-tui = { path = "crates/tui" }
wyj-commands = { path = "crates/commands" }
wyj-mcp = { path = "crates/mcp" }
wyj-i18n = { path = "crates/i18n" }
wyj-store = { path = "crates/store" }
wyj-computer = { path = "crates/computer" }

# 1. 优化所有第三方依赖库的编译（Workspace 核心优化）
# 即使你在开发/测试模式，也让 tokio, reqwest, ratatui 等上百个底层依赖库以零优化、无 debug 符号的方式编译。
# 这样不仅能极大地缩减外部依赖在 target 里的体积，还能大幅加快后续的链接速度。
[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.test.package."*"]
opt-level = 0
debug = false

# 2. dev/test profile：关闭增量编译 + 只保留行号表
#
# 为什么必须关掉 incremental（2026-10-11 实测定位，勿轻易调回）：
# 增量编译会把每个 codegen unit 的目标文件写进 `target/debug/deps/*.o`，文件名带
# metadata hash。源码一改，整个 crate 换一个新 hash → rustc 写出一批全新文件名的 .o，
# 而**被取代的旧 .o 原地保留、cargo 从不回收**。本仓库一次完整构建就产出 10,465 个 .o
# （0.70 GB，全部来自 11 个工作区 crate）；实测「touch crates/core/src/lib.rs +
# cargo build」单轮就新增 1,807 个 .o / 359 MB。按每天 20 轮估算 ≈ 7 GB/天、90 天
# ≈ 630 GB，与实际观察到的 target 膨胀到 225 GB / 134 万文件吻合。
# 代价不只是占盘：cargo 每次调用都要 stat 全部产物才能判断新鲜度，实测真·无变更 build
# 的地板成本随文件数线性增长（4.2 GB / 1.07 万文件 = 0.66s；134 万文件就是分钟级）。
# 关掉后 .o 不再散落到 deps/，产物按 metadata hash 稳定命名并原地覆盖，target 不再单调增长。
[profile.dev]
incremental = false
# 只保留「文件名 + 行号」：panic backtrace 仍能定位到具体行，但不含变量值。
# macOS 上 split-debuginfo = "unpacked" 意味着 DWARF 留在 .o 里，两者相乘才是体积放大器
# （实测每个 .o 平均 70 KB）。完整调试（lldb 看变量/断点）需要时再临时改回 debug = 1。
debug = "line-tables-only"
split-debuginfo = "unpacked" # 在 macOS/Windows 上极其有效，防止符号文件重复打包进二进制中
# codegen-units 保持默认(256)：文件数压力已由 incremental=false 消除，再调低只会拖慢编译。

[profile.test]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"


[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
