help:
  desc: "Show all available commands and keyboard shortcuts"
  body: |-
    # wyj-code v{version} — terminal AI coding assistant

    ## Commands

    - `/help` — Show this help
    - `/clear` — Clear conversation history
    - `/compact [hint]` — Manually compact context to reduce token usage
    - `/config` — Open the configuration settings panel (log_level/language)
    - `/cost` — Show token usage and cost estimate for this session (sub-agent usage listed separately)
    - `/agents` — List available subagent types (built-in + custom *.md definitions)
    - `/subagents [id]` — Open the sub-agent panel to inspect execution detail (including sessions restored via /resume); pass an id (e.g. a3) to jump directly to it
    - `/doctor` — Diagnose environment (API Key / config / memory)
    - `/computer` — Diagnose computer-use (desktop GUI control) availability, registration status, and system permissions
    - `/memory` — Open the CLAUDE.md memory panel
    - `/model [profile]` — Manage call profiles; no arg opens the manager, with a name switches directly
    - `/mcp` — Manage MCP servers (browse/search the Registry, install/upgrade/uninstall, global or project scope)
    - `/skills` — Manage Skills (add a git marketplace source, browse/install/upgrade/uninstall)
    - `/plugins` — Manage Plugins (add a plugin marketplace, browse/install/upgrade/uninstall/enable/disable)
    - `/extensions` — Inspect and diagnose Skill / MCP / Plugin resources
    - `/import` — Scan Codex / Claude Code configs (MCP servers, custom commands, agents) and import selected items into wyj-code
    - `/schedule` — Manage scheduled tasks (cron-triggered prompts); auto-syncs into the system crontab on macOS/Linux
    - `/hooks` — List currently active Hooks (grouped by event)
    - `/plan` — Switch to plan mode (read-only tools + write plan file + ExitPlanMode)
    - `/mode [mode]` — Switch run mode (normal / plan / bypass)
    - `/resume [id]` — Resume a past session (no arg = picker)
    - `/sessions` — View and switch between past sessions
    - `/init` — Have the Agent explore the project and generate/merge CLAUDE.md
    - `/bug [summary]` — Open this repo's GitHub new-issue page prefilled with env info (no deps)
    - `/review [PR#]` — Fetch a PR diff and have the Agent review it (requires gh CLI)
    - `/pr-comments [PR#]` — View comments on a PR (requires gh CLI)
    - `/quit` — Quit wyj-code

    ---

    ## Keyboard shortcuts

    - `Enter` — Send message
    - `Shift+Enter` — Insert newline
    - `Ctrl+C` — Interrupt current task (press twice to quit)
    - `Esc` — Interrupt current task
    - `Shift+Tab` — Cycle mode Normal → Plan → Bypass
    - `Ctrl+O` — Expand/collapse tool result
    - `Ctrl+T` — Focus the task list; expand/collapse it when already focused
    - `Ctrl+L` — Clear screen (keeps conversation history)
    - `Ctrl+A` / `Ctrl+E` — Jump to start / end of line
    - `Ctrl+K` — Delete from cursor to end of line
    - `Ctrl+U` — Delete from cursor to start of line
    - `Ctrl+W` — Delete previous word
    - `↑` / `↓` — Select within the focused list/summary messages when input is empty; otherwise move the cursor or browse input history
    - `Command+↑` / `Command+↓` — Jump to the start / latest message of the current session
    - `/` — Command completion (Tab to confirm, Esc to cancel)
    - `!<command>` — Run a Bash command directly

    ---

    ## Modes

    - `Normal` — Default mode, shows a permission dialog before each tool call
    - `Plan` — Read-only mode, allows read/glob/grep/web_fetch/bash/write(plan file)/ExitPlanMode
    - `Bypass` — Skips all permission prompts, auto-approves every tool call
  custom_commands_header: "Custom Commands"

