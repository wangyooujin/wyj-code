_version: 1
command:
  unknown: "Unknown command: /{name}  (type /help to see all commands)"
skill:
  run:
    desc: "Build and run the current project"
  review:
    desc: "Code review (correctness / simplification / efficiency)"
  fix:
    desc: "Fix a specified error or issue"
  explain:
    desc: "Explain code or a concept in detail"
  commit:
    desc: "Generate a commit message and run git commit"
system_prompt:
  default: |-
    You are a professional AI programming assistant, skilled at analyzing code, solving technical problems, and writing programs.
    When you need to operate on the file system, run commands, or search code, proactively use tools to get the task done.
    Tool usage principle: Read before Write; Edit requires an exact match beforehand.
    Communicate with the user in clear, accurate English, and prioritize runnable code and concrete action steps.
  plan_mode: "## Current mode: Plan (planning & analysis)\n\nYou may only use read-only tools (read / glob / grep / web_fetch).\nYou must not write or edit files, or run shell commands.\nFocus on analyzing code, planning approaches, and explaining architecture."
  plan_turn: "## Current mode: Plan (planning & analysis)\n\nYou may only use read-only tools (Read/Glob/Grep/WebFetch/Bash) and Write (only for writing the plan document).\nFirst analyze the code thoroughly, then write the complete plan to: `{path}`\nAfter writing it, call the `ExitPlanMode` tool to submit the plan and wait for user approval before executing.\nBash commands must be read-only (ls/find/cat/grep, etc.) — no write operations."

claude_md:
  source:
    global: "global"
    project: "project"
    subdir: "subdirectory"
  reminder_intro: "Below is the content of the CLAUDE.md memory files that apply to this project. Follow the instructions within."
  subdir_reminder_intro: "The directory you just accessed has additional CLAUDE.md notes — follow these as well:"
  section_header: "Contents of {path} ({source}):\n\n"

cli:
  about: "wyj-code — terminal AI coding assistant"
  prompt_help: "One-shot Q&A (does not start the TUI)"
  cwd_help: "Working directory (defaults to the current directory)"
  headless_help: "Force headless REPL mode"
  plan_help: "Plan mode: enable only read-only tools (read/glob/grep/web_fetch), for planning and analysis"
  bypass_help: "Bypass mode: auto-approve every tool call, no permission prompts"
  continue_help: "Resume the last session (continue the previous conversation)"
  resume_help: "Resume a specific session ID (e.g. sess-1719723000)"
  profile_help: "One-shot override of which call profile to use this run (not persisted, doesn't change active_profile)"
  profile_not_found: "Profile '{name}' not found — run --config-status to see available profiles"

main:
  session_not_found: "Session {id} not found, starting a new session."
  session_resumed: "Resumed session {id} ({count} messages)"
  session_resumed_last: "Resumed last session {id} ({count} messages)"
  no_session_history: "No session history yet, starting a new session."
  mode_info_plan: " [plan mode: read-only tools only]"
  mode_info_bypass: " [bypass mode: skipping permission prompts]"
  session_stats: "Session stats"

help:
  desc: "Show all available commands and keyboard shortcuts"
  body: |-
    wyj-code v{version} — terminal AI coding assistant

    Commands:
    /help              Show this help
    /clear             Clear conversation history
    /compact [hint]    Manually compact context to reduce token usage
    /config            Open the configuration settings panel (log_level/language, global settings)
    /cost              Show token usage and cost estimate for this session
    /doctor            Diagnose environment (API Key / config / memory)
    /memory            Open the CLAUDE.md memory panel (lists all files in effect, pick one
                       to open in your system editor; includes an auto-memory toggle and index)
    /model [profile]   Manage call profiles (provider/model/base_url/api_key, etc.):
                       no arg opens the profile manager (new/edit/delete/switch);
                       with a profile name, switches to it directly, e.g. /model glm-cheap
    /plan              Switch to plan mode (read-only tools + write plan file + ExitPlanMode)
    /mode [mode]       Switch run mode (normal / plan / bypass)
    /resume [id]       Resume a past session (no arg = picker, id = resume directly)
    /sessions          View and switch between past sessions
    /init              Have the Agent explore the project and generate/merge CLAUDE.md
    /quit              Quit wyj-code

    Keyboard shortcuts:
    Enter              Send message
    Shift+Enter        Insert newline
    Ctrl+C             Interrupt current task (press twice to quit)
    Esc                Interrupt current task
    Shift+Tab          Cycle mode Normal → Plan → Bypass
    Ctrl+O             Expand/collapse tool result
    Ctrl+L             Clear screen (keeps conversation history)
    Ctrl+A / Ctrl+E    Jump to start / end of line
    Ctrl+K             Delete from cursor to end of line
    Ctrl+U             Delete from cursor to start of line
    Ctrl+W             Delete previous word
    PageUp / PageDown  Scroll chat area
    ↑ / ↓              Browse input history
    /                  Command completion (Tab to confirm, Esc to cancel)
    !<command>         Run a Bash command directly

    Modes:
    Normal    Default mode, shows a permission dialog before each tool call
    Plan      Read-only mode, allows read/glob/grep/web_fetch/bash/write(plan file)/ExitPlanMode
    Bypass    Skips all permission prompts, auto-approves every tool call

