  body: "Working directory: {cwd}"

init:
  desc: "Have the Agent explore the project and generate/merge CLAUDE.md"
  agent_prompt: |-
    Generate or update the CLAUDE.md memory file for the current project (working directory: {cwd}).

    Steps:
    1. Explore the project structure: check manifest files like Cargo.toml/package.json/pyproject.toml/go.mod,
       the README, and existing lint/CI configs (e.g. .eslintrc, .golangci.yml, GitHub Actions workflows)
       to determine the tech stack, build/test commands, and coding conventions.
    2. If {cwd}/CLAUDE.md already exists, read it in full first, then merge, extend, and improve it —
       do not overwrite or discard its existing content wholesale.
    3. If the project has other AI assistant rule files such as AGENTS.md or .cursorrules, read them and
       fold in whatever parts still apply.
    4. Write the result to {cwd}/CLAUDE.md. It should include at least: project overview, build/test/lint
       commands, architecture notes, and development conventions. Keep it concise and avoid speculating
       about anything you couldn't verify.

