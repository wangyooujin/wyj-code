  # 第一帧写死进文案：写死的那一行在流式期间永远不转，与标题栏的动画对不上。
  running: "  ⎿ {frame} 思考中…"
  done: "  ⎿ 已思考 {secs}s（{lines} 行）"
  done_no_elapsed: "  ⎿ 已思考（{lines} 行）"
  expand_hint: "  ·  Ctrl+O 展开"
  live_omitted: "⋮ 上面还有 {count} 行"

# 底部进度区（输入框标题栏 spinner / TodoWrite 面板头 / 排队提示）的文案。
# 这些是**用户可见 UI 文案**，必须走 i18n：同一块底部区域里混着中英会让
# 切换 locale 后看起来只翻译了一半。
spinner:
  thinking: "思考中"
  waiting_approval: "等待批准"
  reviewing_plan: "审阅计划"
  queuing_message: "消息排队中"
  stream_rate: "{rate} tok/s"
  queue_hint: "{count} 条已排队（{running}）"
  queue_op_running: "{op} 进行中"
  queue_pending: "等待送达"
  todo_title: "任务列表"
  todo_done: "任务已完成"
  todo_expand: "  （Ctrl+T 展开）"
  todo_collapse: "  （Ctrl+T 折叠）"
  todo_budget_resume: "[本轮工具轮数预算用尽，任务列表还剩 {count} 项未完成——正在自动续跑]"
  todo_auto_resume: "[自动续跑 {round}：接着完成剩余的 {count} 项任务]"
  todo_resume_exhausted: "[自动续跑已达上限，仍有 {count} 项未完成。可手动输入「继续」，或调高 [agent].forced_thinking_max_turns / [agent].max_turns 后重试]"

# 正在执行的工具的实时输出块（只显示尾部若干行）
live_output:
  omitted: "⋮ 上面还有 {count} 行输出"

# 输入框标题栏 spinner 的动词短语：标题栏答「在做什么」，聊天区的 ⏺ 行答「具体
# 对什么做」（参数）。两处都不写工具注册名，用户不必先知道有哪些工具才读得懂。
# 未收录的工具回落工具注册名本身（见 render::tool_activity_label）。
