help:
  desc: "显示所有可用命令和快捷键"
  body: |-
    # wyj-code v{version} — 终端 AI 编程助手

    ## 命令

    - `/help` — 显示此帮助
    - `/clear` — 清空对话历史
    - `/new` — 开启新会话：自动保存当前会话历史到磁盘，分配新 session_id 并清空 TUI 状态（对齐 Claude Code `/new`，无二次确认弹窗）
    - `/compact [提示]` — 手动压缩上下文，减少 token 消耗
    - `/context` — 查看上下文占用分解（system / 工具 / 历史 / 输出预留 / 可回收工具结果），数字与自动压缩阈值同源
    - `/config` — 打开配置设置面板（log_level/language）
    - `/cost` — 显示本会话 token 用量与费用估算（含子 Agent 用量单列）
    - `/agents` — 列出可用的 subagent 类型（内置 + 自定义 *.md 定义）
    - `/subagents [id]` — 打开子 Agent 聚合面板查看执行详情（含 /resume 恢复的历史会话）；带 id（如 a3）直接定位
    - `/shells [id]` — 打开后台 Shell 面板查看 run_in_background 启动的任务实时输出；带 id（如 bash_1）直接定位
    - `/doctor` — 诊断环境（API Key / 配置 / 记忆）
    - `/computer` — 诊断 computer-use（桌面 GUI 控制）可用性、注册状态与系统权限
    - `/memory` — 打开项目记忆面板（AGENTS.md / CLAUDE.md 等规约文件）
    - `/memory clear-all` — 清空 Memory v3 全库（Global + Project claims、jobs、audit），旧数据移到 backups/<ts>/，`rejected_history.json` 保留；TUI 二次确认后执行
    - `/evolve` — 打开自进化治理中心（Active / Candidates / Episodes / Health）
    - `/profile [分组名]` — 管理调用分组；无参数打开管理面板，带分组名直接切换（写盘，成为全局默认）。面板里选中分组后按 Enter →「仅本会话使用」可只对当前会话生效，不写 config.toml，随会话落盘、`--resume` 后继续生效
    - `/model [模型名]` — 切换当前分组下的模型；无参数打开模型选择器（从端点拉取可用模型列表），带模型名直接切换。**仅本次会话生效**，不写 config.toml、不随会话落盘（`--resume` 后回到分组配置的模型）；只影响当前模式实际使用的那个模型字段
    - `/effort [档位]` — 调整思考强度；无参数打开档位面板（只列当前端点真正支持的档位），带档位直接切换，`off` 关闭思考。随会话落盘、`--resume` 后继续生效，不写 config.toml
    - `/mcp` — 管理 MCP server（浏览/搜索 Registry、安装/升级/卸载、全局或项目作用域）
    - `/skills` — 管理 Skill（添加 git marketplace 源、浏览/安装/升级/卸载）
    - `/plugins` — 管理插件（添加插件市场、浏览/安装/升级/卸载/启用/禁用）
    - `/extensions` — 统一查看并诊断 Skill / MCP / Plugin 资源
    - `/hooks` — 列出当前生效的 Hooks 配置（按事件分组）
    - `/plan` — 切换至规划模式（只读工具 + 写计划文件 + ExitPlanMode）
    - `/mode [模式]` — 切换运行模式（auto / plan / bypass）；无参数则显示当前模式
    - `/resume [id]` — 恢复历史会话（无参数=选择器）
    - `/sessions` — 查看和切换历史会话
    - `/init` — 让 Agent 探索项目并生成/合并更新 AGENTS.md；同时确保项目级 .wyj-code/ 配置骨架（mcp.toml/settings.toml 空模板）存在
    - `/bug [简述]` — 在浏览器打开本仓库 GitHub issue 页并预填环境信息（零依赖）
    - `/review [PR编号]` — 拉取 PR diff 交给 Agent 审查（需已安装 gh CLI）
    - `/pr-comments [PR编号]` — 查看指定 PR 的评论（需已安装 gh CLI）
    - `/quit` — 退出 wyj-code

    ---

    ## 快捷键

    - `Enter` — 发送消息
    - `Shift+Enter` — 插入换行
    - `Ctrl+C` — 中断当前任务（二次按下退出程序）
    - `Esc` — 中断当前任务
    - `Shift+Tab` — 循环切换模式 Normal → Plan → Bypass
    - `Ctrl+T` — 聚焦任务列表；已聚焦时折叠/展开任务列表
    - `Ctrl+O` — 强制展开/收起全部 thinking 与工具结果正文（默认自动：执行中展开，跑完即收）
    - `Ctrl+L` — 清屏（保留对话历史）
    - `Ctrl+A` / `Ctrl+E` — 跳到行首 / 行尾
    - `Ctrl+K` — 删除光标到行尾
    - `Ctrl+U` — 删除光标到行首
    - `Ctrl+W` — 删除前一个词
    - `↑` / `↓` — 浏览输入历史；多行输入中先移动光标，到首行/末行后切换历史
    - `Shift+↑` — 进入内容区（优先运行中的子 Agent，其次任务列表、后台任务、聊天区）；`Esc` 逐级返回输入框
    - `PageUp` / `PageDown` — 上下翻阅当前会话内容
    - `鼠标滚轮` — 上下翻阅内容区；指针在输入框上时翻阅输入框自身（长草稿）
    - `拖拽` — 选中内容区或输入框里的文字，松开即自动复制到系统剪贴板；双击选中一个词（路径/URL 整体）。滚动后选区跟着文字走，`Esc` 或任意按键清除
    - `点击输入框` — 光标跳到点击位置，像普通编辑器一样接着打字
    - `拖动右侧滚动条` — 直接跳到对应位置；点轨道也能跳转
    - `Command+↑` / `Command+↓` — 跳到当前会话开头 / 最新消息
    - `Command+点击` / `Ctrl+点击` — 打开回复中的本地文件路径或网页链接
    - `/` — 命令补全（Tab 确认，Esc 取消）
    - `!<命令>` — 直接执行 Bash 命令

    ---

    ## 模式

    - `Normal` — 默认模式，工具调用前弹出权限确认对话框
    - `Plan` — 只读模式，允许 read/glob/grep/web_fetch/bash/write(计划文件)/ExitPlanMode
    - `Bypass` — 跳过所有权限确认，自动批准工具调用

    ---

    ## 报告

    国产模型适配体验对比、踩坑与最佳实践（DeepSeek/GLM/Kimi/Qwen/豆包/MiniMax vs Claude Code/Codex）：[doc/analysis/domestic-models-vs-claude-code.md](https://github.com/wangyooujin/wyj-code/blob/master/doc/analysis/domestic-models-vs-claude-code.md)
  custom_commands_header: "自定义命令"

