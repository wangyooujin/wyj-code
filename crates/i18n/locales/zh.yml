cwd:
  desc: "显示当前工作目录"
  body: "工作目录: {cwd}"

init:
  desc: "让 Agent 探索项目并生成/合并更新 CLAUDE.md"
  agent_prompt: |-
    请为当前项目生成或更新 CLAUDE.md 记忆文件（工作目录：{cwd}）。

    步骤：
    1. 探索项目结构：查看 Cargo.toml/package.json/pyproject.toml/go.mod 等清单文件、README、
       已有的 lint/CI 配置（如 .eslintrc、.golangci.yml、GitHub Actions workflow），
       判断技术栈、构建命令、测试命令、代码规范。
    2. 若 {cwd}/CLAUDE.md 已存在，先完整读取，在其基础上合并、补充、改进，
       不要整体覆盖或丢弃已有内容。
    3. 若项目中存在 AGENTS.md、.cursorrules 等其它 AI 助手规则文件，
       阅读并将其中仍然适用的部分整合进 CLAUDE.md。
    4. 最终把结果写入 {cwd}/CLAUDE.md，内容至少包含：项目概览、构建/测试/lint 命令、
       代码架构说明、开发约定。保持简洁，避免臆测不确定的信息。

