name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check i18n keys
        working-directory: site
        run: node check-i18n.js

      - name: Build Tailwind CSS
        working-directory: site
        run: npx --yes tailwindcss@3 -i ./src/input.css -o ./dist/style.css --minify

      - name: Assemble site
        working-directory: site
        # HTML 用通配：新增页面漏改这一行时，本地一切正常、线上 404。
        # JS 显式列举 script.js —— 唯一的运行时脚本，check-i18n.js 与
        # tailwind.config.js 是开发文件，不应进生产产物。
        run: |
          cp ./*.html ./script.js ./favicon.svg ./*.sh ./*.ps1 dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: gh-pages
