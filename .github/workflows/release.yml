name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要重新验证并发布的既有 annotated tag（例如 v1.5.5）"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY_NAME: wyj-code
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify annotated tag matches checkout and Cargo.toml version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效 release tag: ${RELEASE_TAG}"
            exit 1
          fi
          if [ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]; then
            echo "::error::${RELEASE_TAG} 必须是 annotated tag，不能是 lightweight tag 或分支。"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "${RELEASE_TAG}^{}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::checkout (${HEAD_COMMIT}) 与 tag (${TAG_COMMIT}) 不一致。"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="wyj-code") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag 版本 (${TAG_VERSION}) 与 Cargo.toml 中 workspace 版本 (${CARGO_VERSION}) 不一致。请先更新 Cargo.toml 的 [workspace.package] version 字段，提交后再打 tag。"
            exit 1
          fi
          echo "版本校验通过: ${CARGO_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGE="${BINARY_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp install.sh "$STAGE/"
          chmod +x "$STAGE/install.sh"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}" -replace '^v',''
          $stage = "${env:BINARY_NAME}-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe" -Destination $stage
          if (Test-Path README.md) { Copy-Item README.md -Destination $stage }
          Copy-Item install.bat -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            "$stage.zip.sha256",
            "$hash  $stage.zip`n",
            [System.Text.Encoding]::ASCII
          )

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build and verify combined checksums file
        working-directory: artifacts
        run: |
          sed 's/\r$//' *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/SHA256SUMS
