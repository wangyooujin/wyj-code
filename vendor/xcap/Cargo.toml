[package]
edition = "2024"
name = "xcap"
version = "0.9.8"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "XCap is a cross-platform screen capture library written in Rust. It supports Linux (X11, Wayland), MacOS, Windows, and HarmonyOS (OpenHarmony/OHOS). XCap supports screenshot and video recording (WIP)."
homepage = "https://github.com/nashaofu/xcap"
documentation = "https://docs.rs/xcap"
readme = "README.md"
keywords = [
    "screen",
    "monitor",
    "window",
    "capture",
    "image",
]
license = "Apache-2.0"
repository = "https://github.com/nashaofu/xcap.git"

[features]
image = ["image/default"]
wgc = [
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX_Direct3D11",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT_Graphics_Capture",
]

[lib]
name = "xcap"
path = "src/lib.rs"

[[example]]
name = "focused_window"
path = "examples/focused_window.rs"

[[example]]
name = "monitor"
path = "examples/monitor.rs"

[[example]]
name = "monitor_capture"
path = "examples/monitor_capture.rs"

[[example]]
name = "monitor_record"
path = "examples/monitor_record.rs"

[[example]]
name = "monitor_region_capture"
path = "examples/monitor_region_capture.rs"

[[example]]
name = "window"
path = "examples/window.rs"

[[example]]
name = "window_capture"
path = "examples/window_capture.rs"

[dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.scopeguard]
version = "1.2"

[dependencies.thiserror]
version = "2.0"

[dev-dependencies.fs_extra]
version = "1.3"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.libwayshot-xcap]
version = "0.3.3"
package = "libwayshot-xcap"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.percent-encoding]
version = "2.3"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.pipewire]
version = "0.10"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.rand]
version = "0.10"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.serde]
version = "1.0"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.url]
version = "2.5"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.xcb]
version = "1.7"
features = ["randr"]

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies.zbus]
version = "5.17"

[target.'cfg(target_os = "macos")'.dependencies.dispatch2]
version = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
# 上游未声明 default-features = false，导致 objc2-app-kit 启用全部 298 个
# 默认 feature（294 个生成文件 / 4.9 MB），而 xcap 只用到十来个 AppKit 类。
default-features = false
features = ["std", "NSScreen", "NSWorkspace", "NSGraphics"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-av-foundation]
version = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-media]
version = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-video]
version = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSString", "NSArray", "NSDictionary", "NSValue", "NSObject", "NSData", "NSDate", "NSError", "NSEnumerator", "NSKeyValueCoding"]

[target.'cfg(target_os = "windows")'.dependencies.widestring]
version = "1.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
]

[target.'cfg(target_os="windows")'.dev-dependencies.windows]
version = "0.62"
features = ["Win32_UI_HiDpi"]

